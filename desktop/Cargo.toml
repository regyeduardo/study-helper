[package]
name = "study-helper-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
x11rb = { version = "0.13", features = ["res"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.19"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
strip = true
