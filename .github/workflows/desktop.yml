name: Integração de áudio

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - run: |
          mkdir -p AppDir/usr/bin
          cp target/release/study-helper-audio AppDir/usr/bin/
          cp packaging/study-helper-audio.desktop packaging/study-helper-audio.svg AppDir/
          ln -s usr/bin/study-helper-audio AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir study-helper-audio-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktop/study-helper-audio-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/study-helper-audio.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest study-helper-audio-x86_64.AppImage study-helper-audio.exe \
            --target "$GITHUB_SHA" \
            --title "Integração de áudio" \
            --notes "Grava o som de uma janela ou do computador inteiro e o microfone para o Study Helper. Linux: AppImage. Windows: .exe."
