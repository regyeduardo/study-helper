<!doctype html><html><head><meta charset="utf-8"><title>apresentacao</title></head><body>
<script>
const params = new URLSearchParams(location.search)
document.write(`<script src="app-codec.js"><\/script>`)
</script>
<script>
const post = (path, body) => fetch(path, { method: 'POST', body })
const sleep = ms => new Promise(r => setTimeout(r, ms))
;(async () => {
  if (window.name === 'ran') return
  window.name = 'ran'
  try {
    const seconds = Number(params.get('segundos') || 60)
    // the scene "apresentacao" of e2e/perf/gravacao.mjs: slide every 20 s, a camera always moving in a corner, the mouse 2 s every 15 s
    const canvas = document.createElement('canvas'); canvas.width = 1920; canvas.height = 1080
    const g = canvas.getContext('2d'); const started = performance.now()
    const lines = n => Array.from({ length: 14 }, (_, i) => `${n}.${i + 1} Item de reunião com texto pequeno, números ${(n * 137 + i * 91) % 1000} e nomes: Ana, Bruno, Carla`)
    const camera = (x, y, w, h, t, i) => {
      const gradient = g.createRadialGradient(x + w / 2 + Math.sin(t * 2 + i) * w * 0.15, y + h / 2 + Math.cos(t * 1.3 + i) * h * 0.12, 10, x + w / 2, y + h / 2, w * 0.6)
      gradient.addColorStop(0, '#f3c6a5'); gradient.addColorStop(0.5, '#8a5a44'); gradient.addColorStop(1, '#1e293b')
      g.fillStyle = gradient; g.fillRect(x, y, w, h)
      for (let n = 0; n < 220; n++) { g.fillStyle = `rgba(${(n * 37 + i * 50) % 255},${(n * 91) % 255},${(n * 53) % 255},0.18)`; g.fillRect(x + Math.random() * w, y + Math.random() * h, 6, 6) }
      g.fillStyle = 'rgba(15,23,42,.75)'; g.fillRect(x + 20, y + h - 60, 360, 44); g.fillStyle = '#fff'; g.font = '24px sans-serif'; g.fillText('Ana Ribeiro', x + 32, y + h - 30)
    }
    const draw = () => {
      const t = (performance.now() - started) / 1000
      const slide = Math.floor(t / 20)
      g.fillStyle = '#fff'; g.fillRect(0, 0, 1920, 1080); g.fillStyle = '#1f2937'; g.font = 'bold 56px sans-serif'
      g.fillText(`Slide ${slide + 1}: planejamento do trimestre`, 120, 160)
      const size = Number(params.get('fonte') || 28)
      g.font = size + 'px sans-serif'
      for (let i = 0; i < Math.floor(600 / (size * 1.5)); i++) g.fillText(lines(slide + 1)[i % 14] + (size < 28 ? ' · linha ' + (i + 1) + ', valores 0,17 · 3.482,90 · R$ 12.450,00' : ''), 140, 280 + i * size * 1.5)
      camera(1560, 760, 320, 240, t, 0)
      const along = t % 15 < 2 ? (t % 15) / 2 : 1
      g.fillStyle = '#0f172a'; g.beginPath(); g.arc(300 + along * 900, 920, 8, 0, Math.PI * 2); g.fill()
    }
    draw()
    const screen = new App.ScreenCanvas(30, true)
    screen.show(canvas.captureStream(30))
    const timer = setInterval(draw, 1000 / 30)
    const context = new AudioContext()
    const merger = context.createChannelMerger(2)
    const tone = context.createOscillator(); tone.frequency.value = 330
    const voice = context.createGain(); voice.gain.value = 0.2
    tone.connect(voice); voice.connect(merger, 0, 0); voice.connect(merger, 0, 1); tone.start()
    await context.resume()
    const recorder = await App.CodecRecorder.open(screen, context, merger, { videoBitsPerSecond: App.OPTIMIZED.videoBitsPerSecond[30], audioBitsPerSecond: App.AUDIO_BITS_PER_SECOND, keyFrameIntervalMs: App.OPTIMIZED.keyFrameIntervalMs })
    if (!recorder) throw new Error('CodecRecorder.open: null')
    const chunks = []
    recorder.ondataavailable = event => chunks.push(event.data)
    for (const at of [10, 25, 45]) setTimeout(() => canvas.toBlob(blob => post('/file?name=ref-' + params.get('nome') + '-' + at + '.png', blob), 'image/png'), at * 1000 - (performance.now() - started))
    recorder.start(1000)
    const offset = (performance.now() - started) / 1000
    let hidden = null
    if (params.get('esconder') === '1') { await sleep(2000); hidden = window.open('/blank.html', '_blank'); await sleep(1000); await post('/result', JSON.stringify({ visibility: document.visibilityState })) }
    await sleep(seconds * 1000 - (params.get('esconder') === '1' ? 3000 : 0))
    hidden?.close()
    await new Promise(resolve => { recorder.onstop = resolve; recorder.stop() })
    clearInterval(timer); screen.stop(); await context.close()
    const blob = await App.makeSeekable(new Blob(chunks, { type: recorder.mimeType }))
    const rec = { mimeType: recorder.mimeType }
    const settings = { videoBitsPerSecond: App.OPTIMIZED.videoBitsPerSecond[30] }
    let requested = 0, looks = 0, lookMs = 0
    await post('/video?name=ff3-' + params.get('nome'), blob)
    await post('/result', JSON.stringify({ nome: params.get('nome'), mime: rec.mimeType, bytes: blob.size, seconds, requested, looks, msPerLook: looks ? +(lookMs / looks).toFixed(2) : null, offset, kbps: settings.videoBitsPerSecond / 1000 }))
    await post('/result', JSON.stringify({ done: true }))
  } catch (e) { await post('/result', JSON.stringify({ error: String(e && e.stack || e) })) }
})()
</script></body></html>
