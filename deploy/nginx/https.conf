# Port 443: reverse proxy to the Go service.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.study.ryns.me;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.study.ryns.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.study.ryns.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # uploads in 10 MiB parts, with room
    client_max_body_size 32m;

    # spec 007 (research R5): the map, the parts and a transcript of 1 hour go compressed; the media stays as it is (Range)
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json text/markdown text/plain application/x-ndjson;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live channel (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # media with Range and long answers, without buffering on disk
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
